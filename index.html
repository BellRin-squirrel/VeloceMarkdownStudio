  <style>
    /* ----------------------------------
     * デザインシステム & 変数
     * ---------------------------------- */
    :root {
      --bg-main: #0f172a;
      --bg-panel: #ffffff;
      --bg-subtle: #f8fafc;
      --border-color: #e2e8f0;
      --text-main: #1e293b;
      --text-muted: #64748b;
      
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-light: #e0e7ff;
      --accent-glow: rgba(99, 102, 241, 0.15);

      --code-bg: #181e29;
      --code-header: #10141d;
      --code-border: #283143;
      --code-text: #e2e8f0;
      --code-line-num: #52617a;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 10px 25px rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      background-color: var(--bg-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ----------------------------------
     * アプリケーションヘッダー
     * ---------------------------------- */
    header {
      background: linear-gradient(90deg, #0f172a 0%, #1e1b4b 100%);
      color: #fff;
      height: 54px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 200;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }

    .brand-icon svg {
      width: 16px;
      height: 16px;
      fill: #fff;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.8rem;
      color: #94a3b8;
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* ----------------------------------
     * ワークスペーススプリット
     * ---------------------------------- */
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 54px);
      overflow: hidden;
      background-color: var(--bg-subtle);
    }

    /* エディタ（左ペイン） */
    .editor-wrapper {
      flex: 1;
      background-color: #ffffff;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .pane-header {
      height: 38px;
      background-color: #fafbfc;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      flex: 1;
      padding: 24px 28px;
      border: none;
      resize: none;
      outline: none;
      font-family: 'Fira Code', ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 14.5px;
      line-height: 1.75;
      color: #1e293b;
      background-color: transparent;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }

    textarea::placeholder {
      color: #94a3b8;
    }

    /* プレビュー（右ペイン） */
    .preview-wrapper {
      flex: 1;
      overflow-y: auto;
      background-color: #ffffff;
      padding: 36px 44px;
      position: relative;
      scrollbar-width: thin;
      scrollbar-color: #cbd5e1 transparent;
    }

    /* ----------------------------------
     * 独自Markdownタイポグラフィ & デザイン
     * ---------------------------------- */
    .markdown-body {
      max-width: 820px;
      margin: 0 auto;
      color: #334155;
      font-size: 15.5px;
      line-height: 1.8;
    }

    .markdown-body h1 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
      letter-spacing: -0.025em;
      margin-top: 10px;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
      position: relative;
    }
    
    .markdown-body h1::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 48px;
      height: 2px;
      background-color: var(--accent);
      border-radius: 2px;
    }

    .markdown-body h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #1e293b;
      letter-spacing: -0.015em;
      margin-top: 36px;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #f1f5f9;
    }

    .markdown-body h3 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #334155;
      margin-top: 24px;
      margin-bottom: 12px;
    }

    .markdown-body p {
      margin-bottom: 18px;
    }

    .markdown-body hr {
      border: none;
      height: 1px;
      background-color: #e2e8f0;
      margin: 36px 0;
    }

    .markdown-body blockquote {
      margin: 20px 0;
      padding: 14px 20px;
      border-left: 4px solid var(--accent);
      background-color: #f8fafc;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      color: #475569;
      font-style: italic;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 6px;
    }

    /* インラインコード */
    .markdown-body :not(pre) > code {
      font-family: 'Fira Code', monospace;
      font-size: 0.88em;
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
    }

    /* データテーブル */
    .markdown-body table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      margin: 24px 0;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .markdown-body th {
      background-color: #f8fafc;
      font-weight: 600;
      color: #475569;
      text-align: left;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 13.5px;
    }

    .markdown-body td {
      padding: 12px 16px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      color: #334155;
      transition: background-color 0.15s ease;
    }

    .markdown-body tr:last-child td {
      border-bottom: none;
    }

    .markdown-body tr:hover td {
      background-color: #fcfdfe;
    }

    /* ----------------------------------
     * 独自コードブロックデザイン
     * ---------------------------------- */
    .code-block-container {
      position: relative;
      margin: 24px 0;
      border-radius: var(--radius-md);
      background-color: var(--code-bg);
      border: 1px solid var(--code-border);
      overflow: hidden;
      box-shadow: var(--shadow-md);
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .code-block-container:hover {
      border-color: #3b465b;
      box-shadow: var(--shadow-lg);
    }
    
    .code-header {
      background-color: var(--code-header);
      border-bottom: 1px solid var(--code-border);
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      user-select: none;
      transition: background-color 0.15s ease;
    }

    .code-header-interactive {
      cursor: pointer;
    }

    .code-header-interactive:hover {
      background-color: #171d29;
    }
    
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--code-text);
      font-size: 13px;
      font-weight: 500;
      font-family: 'Fira Code', monospace;
    }

    .file-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .fold-icon {
      font-size: 9px;
      color: #64748b;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-block;
    }
    
    .copy-button {
      background-color: rgba(255, 255, 255, 0.05);
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .copy-button:hover {
      background-color: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    .copy-button.copied {
      background-color: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }

    /* コード本体・行番号 */
    .code-body {
      display: flex;
    }

    .line-numbers {
      padding: 18px 0;
      text-align: right;
      color: var(--code-line-num);
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      line-height: 22px;
      user-select: none;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      background-color: rgba(0, 0, 0, 0.15);
      min-width: 3.8em;
      padding-right: 12px;
    }

    .line-numbers span {
      display: block;
    }

    pre {
      margin: 0 !important;
      padding: 18px !important;
      overflow-x: auto;
      flex: 1;
      background: transparent !important;
    }

    pre code {
      font-family: 'Fira Code', monospace !important;
      font-size: 13px !important;
      line-height: 22px !important;
      background: transparent !important;
      padding: 0 !important;
      display: block;
    }

    /* 折りたたみ状態 */
    .code-block-container.collapsed .code-body {
      display: none;
    }

    .code-block-container.collapsed .fold-icon {
      transform: rotate(-90deg);
    }

    /* ----------------------------------
     * スクロール追従固定フローティングヘッダー
     * ---------------------------------- */
    .floating-header {
      position: absolute;
      left: 44px;
      right: 44px;
      z-index: 100;
      border-radius: var(--radius-md) var(--radius-md) 0 0;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
      background-color: rgba(16, 20, 29, 0.95);
      border: 1px solid var(--code-border);
      border-bottom: 1px solid #38455d;
    }
  </style>
</head>

洗練されたデザインとエンジニアリング向けの拡張機能を備えたリアルタイム・ドキュメントワークスペースです。

## 主な機能と特徴
- **リアルタイム・デュアルレンダリング**: 左側の編集が右側のビューへ即座に反映
- **インテリジェント・コードブロック**: ファイル名指定、行番号、コピー、折りたたみトグル
- **スティッキー追従ヘッダー**: 長いコードの閲覧中、上端にファイルバーが滑らかに追従

## データテーブル
直感的でクリーンなテーブルデザインを標準提供しています。

| コンポーネント | 技術仕様 | 状態 |
| :--- | :---: | ---: |
| Markdown Parser | marked.js 15+ | 稼働中 |
| Syntax Highlighter | highlight.js | 稼働中 |
| UI Framework | Modern CSS Variables | 最適化済 |

## 拡張コードブロック（追従・トグル機能）
コードヘッダー（コピーボタン以外）をクリックすると、コンテンツを瞬時に折りたたむことができます。
また、縦に長いコードブロックを下にスクロールすると、自動的に上端へスティッキーバーとして追従します。

\`\`\`typescript:analytics-service.ts
import { EventEmitter } from 'events';

export interface PerformanceMetrics {
  renderTime: number;
  tokenCount: number;
  timestamp: number;
}

export class MarkdownEngine extends EventEmitter {
  private cache: Map<string, string> = new Map();

  constructor(private readonly options: Record<string, unknown> = {}) {
    super();
  }

  /**
   * ドキュメントパースとパフォーマンス計測
   */
  public parseDocument(source: string): string {
    const startTime = performance.now();
    
    if (this.cache.has(source)) {
      return this.cache.get(source)!;
    }

    // パーサー実行シミュレーション
    const rendered = source.trim();
    this.cache.set(source, rendered);

    const duration = performance.now() - startTime;
    this.emit('metric', {
      renderTime: duration,
      tokenCount: source.length,
      timestamp: Date.now()
    } as PerformanceMetrics);

    return rendered;
  }
}
\`\`\`

    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const previewWrapper = document.getElementById('preview-wrapper');
    const floatingHeader = document.getElementById('floating-code-header');
    const floatingFileName = document.getElementById('floating-file-name');
    const floatingCopyBtn = document.getElementById('floating-copy-btn');
    const charCount = document.getElementById('char-count');

    let activeCodeText = '';

    // markedの初期構成
    marked.setOptions({
      gfm: true,
      breaks: true,
    });

    // コードブロックの折りたたみ処理
    function toggleCodeCollapse(container) {
      container.classList.toggle('collapsed');
      previewWrapper.dispatchEvent(new Event('scroll'));
    }

    // プレビューの更新処理
    function updatePreview() {
      const rawMarkdown = editor.value;
      charCount.textContent = `${rawMarkdown.length.toLocaleString()} 文字`;

      let html = marked.parse(rawMarkdown);
      
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      
      // シンタックスハイライト適用
      tempDiv.querySelectorAll('pre code').forEach((block) => {
        hljs.highlightElement(block);
      });
      
      const preElements = tempDiv.querySelectorAll('pre');
      preElements.forEach((pre) => {
        const code = pre.querySelector('code');
        if (!code) return;
        
        const rawCodeText = code.textContent;
        const className = code.className || '';
        let fileName = '';
        let lang = '';

        if (className.startsWith('language-')) {
          const cleanClassName = className.replace('hljs ', '');
          const parts = cleanClassName.replace('language-', '').split(':');
          lang = parts[0];
          if (parts.length > 1) {
            fileName = parts[1];
          }
        }

        if (lang) {
          code.className = `hljs language-${lang}`;
        }

        const displayName = fileName || (lang ? lang.toUpperCase() : 'SOURCE CODE');
        
        const lines = rawCodeText.replace(/\n$/, '').split('\n');
        const lineCount = lines.length;
        
        let lineNumbersHTML = '';
        for (let i = 1; i <= lineCount; i++) {
          lineNumbersHTML += `<span>${i}</span>`;
        }
        
        // コードブロックコンテナ生成
        const container = document.createElement('div');
        container.className = 'code-block-container';
        container.setAttribute('data-filename', displayName);
        container.setAttribute('data-code', rawCodeText);
        
        const header = document.createElement('div');
        header.className = 'code-header code-header-interactive';
        header.addEventListener('click', () => {
          toggleCodeCollapse(container);
        });
        
        const headerLeft = document.createElement('div');
        headerLeft.className = 'header-left';
        
        const foldIcon = document.createElement('span');
        foldIcon.className = 'fold-icon';
        foldIcon.textContent = '▼';
        
        const fileNameSpan = document.createElement('span');
        fileNameSpan.className = 'file-name';
        fileNameSpan.textContent = displayName;
        
        headerLeft.appendChild(foldIcon);
        headerLeft.appendChild(fileNameSpan);
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-button';
        copyBtn.innerHTML = copyIconHTML;
        
        copyBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          navigator.clipboard.writeText(rawCodeText).then(() => {
            copyBtn.innerHTML = successIconHTML;
            copyBtn.classList.add('copied');
            setTimeout(() => {
              copyBtn.innerHTML = copyIconHTML;
              copyBtn.classList.remove('copied');
            }, 2000);
          });
        });
        
        header.appendChild(headerLeft);
        header.appendChild(copyBtn);
        
        const body = document.createElement('div');
        body.className = 'code-body';
        
        const lineNumbersDiv = document.createElement('div');
        lineNumbersDiv.className = 'line-numbers';
        lineNumbersDiv.innerHTML = lineNumbersHTML;
        
        const newPre = pre.cloneNode(true);
        
        body.appendChild(lineNumbersDiv);
        body.appendChild(newPre);
        
        container.appendChild(header);
        container.appendChild(body);
        
        pre.parentNode.replaceChild(container, pre);
      });
      
      // DOMを安全に差し替え
      preview.innerHTML = '';
      while (tempDiv.firstChild) {
        preview.appendChild(tempDiv.firstChild);
      }

      previewWrapper.dispatchEvent(new Event('scroll'));
    }

    // スクロール追従（固定フローティングヘッダー）の制御
    previewWrapper.addEventListener('scroll', () => {
      const scrollTop = previewWrapper.scrollTop;
      floatingHeader.style.top = `${scrollTop}px`;
      
      const containers = previewWrapper.querySelectorAll('.code-block-container');
      let showingFloatingHeader = false;
      const wrapperRect = previewWrapper.getBoundingClientRect();
      const wrapperTop = wrapperRect.top;
      
      activeContainer = null;
      
      for (let container of containers) {
        if (container.classList.contains('collapsed')) continue;
        
        const rect = container.getBoundingClientRect();
        if (rect.top < wrapperTop && rect.bottom > wrapperTop) {
          const fileName = container.getAttribute('data-filename') || 'SOURCE CODE';
          const codeText = container.getAttribute('data-code') || '';
          
          floatingFileName.textContent = fileName;
          activeCodeText = codeText;
          activeContainer = container;
          showingFloatingHeader = true;
          break;
        }
      }
      
      floatingHeader.style.display = showingFloatingHeader ? 'flex' : 'none';
    });

    floatingHeader.addEventListener('click', () => {
      if (!activeContainer) return;
      activeContainer.classList.add('collapsed');
      activeContainer.scrollIntoView({ block: 'center', behavior: 'smooth' });
      floatingHeader.style.display = 'none';
    });

    floatingCopyBtn.innerHTML = copyIconHTML;
    floatingCopyBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!activeCodeText) return;
      
      navigator.clipboard.writeText(activeCodeText).then(() => {
        floatingCopyBtn.innerHTML = successIconHTML;
        floatingCopyBtn.classList.add('copied');
        setTimeout(() => {
          floatingCopyBtn.innerHTML = copyIconHTML;
          floatingCopyBtn.classList.remove('copied');
        }, 2000);
      });
    });

    editor.addEventListener('input', updatePreview);

    // 初期化実行
    editor.value = initialMarkdown;
    updatePreview();
  </script>
</body>
</html>
